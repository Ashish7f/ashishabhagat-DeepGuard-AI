services:
  - type: web
    name: ashishabhagat-DeepGuard-AI
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python download_weights.py
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
